<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault · Catálogo de películas</title>
  <meta name="description" content="Catálogo de películas construido en JavaScript Vanilla consumiendo una API REST pública." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="filmstrip filmstrip--top" aria-hidden="true"></div>
    <div class="site-header__inner">
      <div class="brand">
        <span class="brand__mark">●</span>
        <h1 class="brand__name">Cine<span>Vault</span></h1>
      </div>

      <form class="filters" id="filters-form" role="search">
        <label class="visually-hidden" for="search-input">Buscar película por título</label>
        <input
          id="search-input"
          class="filters__search"
          type="search"
          placeholder="Buscar por título…"
          autocomplete="off"
        />

        <label class="visually-hidden" for="genre-select">Filtrar por género</label>
        <select id="genre-select" class="filters__select">
          <option value="all">Todos los géneros</option>
        </select>
      </form>
    </div>
  </header>

  <main class="page" id="main-content">

    <section class="catalog-meta" id="catalog-meta" aria-live="polite">
      <p class="catalog-meta__text">Cargando catálogo…</p>
    </section>

    <section aria-live="polite" aria-busy="true" id="status-region" class="status-region" hidden></section>

    <section class="catalog" id="catalog-section">
      <div class="movie-grid" id="movie-grid"></div>
    </section>

    <nav class="pagination" id="pagination" aria-label="Paginación del catálogo" hidden>
      <div class="filmstrip filmstrip--pagination" aria-hidden="true"></div>
      <div class="pagination__controls" id="pagination-controls"></div>
    </nav>

  </main>

  <footer class="site-footer">
    <div class="filmstrip filmstrip--bottom" aria-hidden="true"></div>
    <p>Actividad práctica académica · Datos servidos por <a href="https://devsapihub.com/docs/api-movies" target="_blank" rel="noopener">Devs API Hub</a></p>
  </footer>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" id="modal-close" type="button" aria-label="Cerrar detalle">✕</button>
      <div class="modal__body" id="modal-body">
        <!-- contenido inyectado dinámicamente por js/components/modal.js -->
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
